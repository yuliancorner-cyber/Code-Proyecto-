<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halden R1 Configurator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Layout: a studio stage (the turntable) beside a spec-sheet panel; on phones the stage sits on top and the panel scrolls under it. */
:root {
  --bg: #F4F5F7;
  --surface: #FFFFFF;
  --fg: #14171C;
  --muted: #5B6470;
  --line: #D9DDE3;
  --accent: #2447E6;
  --stage-hi: #FCFCFD;
  --stage-lo: #D3D8E0;
  --tt: #ECEEF1;
  --tt-edge: #C6CBD3;
  --tt-mark: #A3ABB7;
  --shadow: 0.26;
  --chip-ring: rgba(20, 23, 28, 0.22);
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418; --surface: #191D23; --fg: #ECEFF3; --muted: #9AA4B1; --line: #2C323B;
    --accent: #93A8FF; --stage-hi: #3A414C; --stage-lo: #15181D;
    --tt: #2C3139; --tt-edge: #1E2228; --tt-mark: #5A6472; --shadow: 0.5;
    --chip-ring: rgba(236, 239, 243, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418; --surface: #191D23; --fg: #ECEFF3; --muted: #9AA4B1; --line: #2C323B;
  --accent: #93A8FF; --stage-hi: #3A414C; --stage-lo: #15181D;
  --tt: #2C3139; --tt-edge: #1E2228; --tt-mark: #5A6472; --shadow: 0.5;
  --chip-ring: rgba(236, 239, 243, 0.3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 15px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(340px, 410px);
}

/* ---------- Stage ---------- */
.stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: radial-gradient(120% 90% at 50% 30%, var(--stage-hi) 0%, var(--stage-lo) 100%);
  overflow: hidden;
}
#view {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
#view:active { cursor: grabbing; }
.stage-row {
  position: absolute; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.stage-row > * { pointer-events: auto; }
.stage-top { top: 0; padding-block: 14px; }
.stage-bottom { bottom: 0; padding-block: 12px; }
.wordmark {
  font: 800 17px/1 var(--font-display);
  font-stretch: 125%;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.bag {
  display: inline-flex; align-items: center; gap: 8px;
  font-weight: 600; font-size: 13px;
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
}
.bag b {
  min-width: 20px; height: 20px; padding: 0 6px;
  display: inline-grid; place-items: center;
  border-radius: 999px;
  background: var(--fg); color: var(--bg);
  font-size: 12px; font-variant-numeric: tabular-nums;
}
.bag.bump b { animation: bump 0.45s ease-out; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.45); } 100% { transform: scale(1); } }
.hint { font-size: 12.5px; color: var(--muted); }
.ghost {
  font-size: 12.5px; font-weight: 600;
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  cursor: pointer;
}
.ghost:hover { border-color: var(--fg); }
.stage-msg {
  position: absolute; inset: 0;
  margin: 0;
  display: grid; place-items: center;
  padding: 24px;
  text-align: center;
  color: var(--muted);
  font-size: 15px;
}

/* ---------- Panel ---------- */
.panel {
  min-width: 0; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--surface);
  border-left: 1px solid var(--line);
}
.panel-scroll {
  flex: 1; min-height: 0;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 26px;
  padding-block: 26px 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow {
  margin: 0;
  font-size: 11.5px; font-weight: 600;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted);
}
h1 {
  margin: 6px 0 0;
  font: 800 38px/1 var(--font-display);
  font-stretch: 125%;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.specs {
  margin: 14px 0 0; padding: 0;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
}
.specs div { padding: 10px 0; }
.specs div + div { padding-left: 12px; border-left: 1px solid var(--line); }
.specs dt { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.specs dd { margin: 2px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; }

fieldset { margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
legend { padding: 0; float: left; width: 100%; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
legend + * { clear: both; }
.legend-name { font-weight: 700; }
.legend-value { font-size: 13.5px; color: var(--muted); text-align: right; }
.legend-value .delta { color: var(--accent); font-weight: 600; margin-left: 6px; }

.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch { position: relative; display: block; cursor: pointer; }
.swatch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.chip {
  display: block; width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--chip);
  box-shadow: inset 0 0 0 1px var(--chip-ring);
  outline: 2px solid transparent; outline-offset: 3px;
  transition: outline-color 0.15s, transform 0.15s;
}
.swatch:hover .chip { transform: scale(1.06); }
.swatch input:checked + .chip { outline-color: var(--fg); }
.swatch input:focus-visible + .chip { outline-color: var(--accent); }

.materials { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.material { position: relative; display: block; cursor: pointer; }
.material input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.material .card {
  display: flex; flex-direction: column; gap: 2px;
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: 10px;
  transition: border-color 0.15s;
}
.material .card strong { font-weight: 700; }
.material .card span { font-size: 13px; color: var(--muted); }
.material:hover .card { border-color: var(--muted); }
.material input:checked + .card { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.material input:focus-visible + .card { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

.initials-row { display: flex; align-items: center; gap: 14px; }
#initials {
  width: 104px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  font: 700 20px/1.2 var(--font-display);
  font-stretch: 125%;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  text-align: center;
}
#initials::placeholder { color: var(--muted); opacity: 0.55; }
#initials:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.initials-row p { margin: 0; font-size: 13px; color: var(--muted); min-width: 0; }

.build { margin: 0; padding: 14px 0 0; list-style: none; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.build li { display: flex; justify-content: space-between; gap: 12px; font-size: 13.5px; }
.build li span:first-child { color: var(--muted); min-width: 0; }
.build li span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }

.buybar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.price-label { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
#price {
  display: block;
  font: 800 30px/1.05 var(--font-display);
  font-stretch: 125%;
  font-variant-numeric: tabular-nums;
}
#add {
  flex: 0 1 210px;
  padding: 15px 20px;
  border: 0; border-radius: 999px;
  background: var(--fg); color: var(--bg);
  font-weight: 700; font-size: 15px;
  cursor: pointer;
  transition: transform 0.12s;
}
#add:hover { transform: translateY(-1px); }
#add:active { transform: translateY(1px); }
#add:focus-visible, .ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

@media (min-width: 861px) {
  .panel-scroll, .buybar { padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
  .stage-row { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .stage-top { padding-block: 22px; }
  .stage-bottom { padding-block: 20px; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 43% minmax(0, 1fr); }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .panel-scroll { gap: 22px; padding-block: 18px; }
  h1 { font-size: 30px; }
  .hint { display: none; }
  .stage-bottom { justify-content: flex-end; }
}
@media (prefers-reduced-motion: reduce) {
  .chip, #add, .material .card { transition: none; }
  .bag.bump b { animation: none; }
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="app">
  <section class="stage" aria-label="3D view of the shoe">
    <canvas id="view" aria-label="Running shoe on a turntable. Drag to orbit the camera."></canvas>
    <div class="stage-row stage-top">
      <span class="wordmark">Halden</span>
      <span class="bag" id="bag" aria-live="polite">Bag <b id="bag-count">0</b></span>
    </div>
    <div class="stage-row stage-bottom">
      <span class="hint">Drag to orbit. Scroll or pinch to zoom.</span>
      <button class="ghost" id="spin-toggle" type="button" aria-pressed="false">Pause turntable</button>
    </div>
    <p class="stage-msg" id="stage-msg" hidden></p>
  </section>

  <aside class="panel" aria-label="Configure your shoe">
    <div class="panel-scroll">
      <header>
        <p class="eyebrow">Road running · Daily trainer</p>
        <h1>Halden R1</h1>
        <dl class="specs">
          <div><dt>Weight</dt><dd>238 g</dd></div>
          <div><dt>Drop</dt><dd>8 mm</dd></div>
          <div><dt>Stack</dt><dd>34 / 26 mm</dd></div>
        </dl>
      </header>

      <fieldset>
        <legend><span class="legend-name">Upper</span><span class="legend-value" id="val-upper"></span></legend>
        <div class="swatches" id="opt-upper"></div>
      </fieldset>
      <fieldset>
        <legend><span class="legend-name">Sole</span><span class="legend-value" id="val-sole"></span></legend>
        <div class="swatches" id="opt-sole"></div>
      </fieldset>
      <fieldset>
        <legend><span class="legend-name">Laces</span><span class="legend-value" id="val-laces"></span></legend>
        <div class="swatches" id="opt-laces"></div>
      </fieldset>
      <fieldset>
        <legend><span class="legend-name">Material</span><span class="legend-value" id="val-material"></span></legend>
        <div class="materials" id="opt-material"></div>
      </fieldset>
      <fieldset>
        <legend><span class="legend-name"><label for="initials">Heel initials</label></span><span class="legend-value" id="val-initials"></span></legend>
        <div class="initials-row">
          <input id="initials" name="initials" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="3" placeholder="ABC">
          <p>Up to 3 letters or numbers, stitched on the heel. Adds $12.</p>
        </div>
      </fieldset>

      <ul class="build" id="build" aria-label="Price breakdown"></ul>
    </div>

    <div class="buybar">
      <div>
        <span class="price-label">Total</span>
        <output id="price" for="initials" aria-live="polite">$140</output>
      </div>
      <button id="add" type="button">Add to bag</button>
    </div>
  </aside>
</div>

<script type="module">
/* ============================================================
   Catalogue and price (plain data + pure functions)
   ============================================================ */
const BASE_PRICE = 140;
const INITIALS_PRICE = 12;
const OPTIONS = {
  upper: [
    { id: 'cobalt',   name: 'Cobalt',     hex: '#2B4FE0', price: 0 },
    { id: 'chalk',    name: 'Chalk',      hex: '#E9E6DF', price: 0 },
    { id: 'graphite', name: 'Graphite',   hex: '#30343B', price: 0 },
    { id: 'forest',   name: 'Forest',     hex: '#1F5A45', price: 0 },
    { id: 'signal',   name: 'Signal red', hex: '#E0392D', price: 5 },
    { id: 'volt',     name: 'Volt',       hex: '#C6EE3A', price: 5 },
  ],
  sole: [
    { id: 'white', name: 'White',    hex: '#F3F3F0', price: 0 },
    { id: 'black', name: 'Black',    hex: '#1D1E21', price: 0 },
    { id: 'ice',   name: 'Ice blue', hex: '#BCD6EC', price: 5 },
    { id: 'volt',  name: 'Volt',     hex: '#C6EE3A', price: 5 },
    { id: 'gum',   name: 'Gum',      hex: '#B88750', price: 8 },
  ],
  laces: [
    { id: 'white',  name: 'White',      hex: '#F5F5F2', price: 0 },
    { id: 'black',  name: 'Black',      hex: '#1D1E21', price: 0 },
    { id: 'signal', name: 'Signal red', hex: '#E0392D', price: 0 },
    { id: 'volt',   name: 'Volt',       hex: '#C6EE3A', price: 0 },
    { id: 'silver', name: 'Reflective', hex: '#C3C9D2', price: 4 },
  ],
  material: [
    { id: 'mesh',    name: 'Engineered mesh', note: 'Light and breathable', price: 0 },
    { id: 'leather', name: 'Leather',         note: 'Smooth full grain',    price: 35 },
  ],
};
const GROUPS = ['upper', 'sole', 'laces', 'material'];
const LABELS = { upper: 'upper', sole: 'sole', laces: 'laces', material: '' };

const state = { upper: 'cobalt', sole: 'white', laces: 'white', material: 'mesh', initials: '' };

const find = (group, id) => OPTIONS[group].find((o) => o.id === id) || OPTIONS[group][0];
const cleanInitials = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);

function priceLines(s) {
  const lines = [['Halden R1', BASE_PRICE]];
  for (const g of GROUPS) {
    const o = find(g, s[g]);
    if (o.price) lines.push([`${o.name} ${LABELS[g]}`.trim(), o.price]);
  }
  if (s.initials) lines.push([`Heel initials ${s.initials}`, INITIALS_PRICE]);
  return lines;
}
const totalPrice = (s) => priceLines(s).reduce((sum, l) => sum + l[1], 0);

/* ============================================================
   Panel UI
   ============================================================ */
const $ = (sel) => document.querySelector(sel);
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let view3d = null;          // set once the 3D scene is ready
let shownPrice = BASE_PRICE;
let priceAnim = 0;

function renderOptions() {
  for (const g of ['upper', 'sole', 'laces']) {
    $(`#opt-${g}`).innerHTML = OPTIONS[g].map((o) => `
      <label class="swatch" title="${o.name}${o.price ? ` (+$${o.price})` : ''}">
        <input type="radio" name="${g}" id="${g}-${o.id}" value="${o.id}"${state[g] === o.id ? ' checked' : ''}>
        <span class="chip" style="--chip:${o.hex}"></span>
        <span class="sr">${o.name}${o.price ? `, adds $${o.price}` : ''}</span>
      </label>`).join('');
  }
  $('#opt-material').innerHTML = OPTIONS.material.map((o) => `
    <label class="material">
      <input type="radio" name="material" id="material-${o.id}" value="${o.id}"${state.material === o.id ? ' checked' : ''}>
      <span class="card"><strong>${o.name}</strong><span>${o.note} · ${o.price ? `+$${o.price}` : 'Included'}</span></span>
    </label>`).join('');
  $('#initials').value = state.initials;
}

function setPrice(target) {
  cancelAnimationFrame(priceAnim);
  const out = $('#price');
  if (reduceMotion || target === shownPrice) { shownPrice = target; out.textContent = `$${target}`; return; }
  const from = shownPrice, t0 = performance.now(), dur = 320;
  const step = (now) => {
    const k = Math.min(1, (now - t0) / dur);
    shownPrice = Math.round(from + (target - from) * (1 - Math.pow(1 - k, 3)));
    out.textContent = `$${shownPrice}`;
    if (k < 1) priceAnim = requestAnimationFrame(step);
  };
  priceAnim = requestAnimationFrame(step);
}

function update() {
  for (const g of GROUPS) {
    const o = find(g, state[g]);
    $(`#val-${g}`).innerHTML = `${o.name}${o.price ? `<span class="delta">+$${o.price}</span>` : ''}`;
  }
  $('#val-initials').innerHTML = state.initials ? `${state.initials}<span class="delta">+$${INITIALS_PRICE}</span>` : 'None';
  $('#build').innerHTML = priceLines(state).map(([name, amount], i) =>
    `<li><span>${name}</span><span>${i ? '+' : ''}$${amount}</span></li>`).join('');
  setPrice(totalPrice(state));
  if (view3d) view3d.apply(state);
}

document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.matches('input[type="radio"]') && GROUPS.includes(el.name)) { state[el.name] = el.value; update(); }
});
$('#initials').addEventListener('input', (e) => {
  const v = cleanInitials(e.target.value);
  if (v !== e.target.value) e.target.value = v;
  state.initials = v;
  update();
});

let bagCount = 0, addTimer = 0;
$('#add').addEventListener('click', () => {
  bagCount += 1;
  $('#bag-count').textContent = bagCount;
  const bag = $('#bag');
  bag.classList.remove('bump'); void bag.offsetWidth; bag.classList.add('bump');
  const btn = $('#add');
  btn.textContent = 'Added to bag';
  clearTimeout(addTimer);
  addTimer = setTimeout(() => { btn.textContent = 'Add to bag'; }, 1700);
  if (view3d) view3d.celebrate();
});

let spinning = !reduceMotion;
function syncSpinButton() {
  const b = $('#spin-toggle');
  b.textContent = spinning ? 'Pause turntable' : 'Spin turntable';
  b.setAttribute('aria-pressed', String(!spinning));
}
$('#spin-toggle').addEventListener('click', () => { spinning = !spinning; syncSpinButton(); });

function stageMessage(text) {
  const m = $('#stage-msg');
  m.textContent = text;
  m.hidden = false;
  $('#view').hidden = true;
  $('#spin-toggle').hidden = true;
}

/* ============================================================
   3D scene
   ============================================================ */
async function init3D() {
  let THREE, OrbitControls, RoomEnvironment;
  try {
    THREE = await import('three');
    ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
    ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
  } catch (err) {
    console.error(err);
    stageMessage('The 3D view could not load. Check your connection, then reload the page.');
    return;
  }

  const canvas = $('#view');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  } catch (err) {
    console.error(err);
    stageMessage('This browser could not start WebGL, so the 3D view is unavailable.');
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  const TARGET = new THREE.Vector3(0, 0.78, 0);
  camera.position.set(3.4, 2.5, 6.4);

  const controls = new OrbitControls(camera, canvas);
  controls.target.copy(TARGET);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.minPolarAngle = 0.25;
  controls.maxPolarAngle = Math.PI / 2 - 0.06;

  /* ---- Studio lighting ---- */
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb9c0cc, 0.55));
  const key = new THREE.DirectionalLight(0xfff4e6, 2.6);
  key.position.set(3.5, 7.5, 4.5);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.near = 1; key.shadow.camera.far = 22;

  let lastMaterial = null, lastLabel = '';
  function apply(s) {
    const up = find('upper', s.upper).hex, so = find('sole', s.sole).hex, la = find('laces', s.laces).hex;
    upperMat.color.set(up);
    overlayMat.color.set(up).multiplyScalar(0.72);
    upperMat.sheenColor.set(up);
    soleMat.color.set(so);
    outsoleMat.color.set(so).multiplyScalar(0.28);
    laceMat.color.set(la);
    if (s.material !== lastMaterial) {
      lastMaterial = s.material;
      if (s.material === 'leather') {
        Object.assign(upperMat, { map: null, bumpMap: grainTex, bumpScale: 0.35, roughness: 0.4, sheen: 0, clearcoat: 0.4, clearcoatRoughness: 0.4 });
        Object.assign(overlayMat, { roughness: 0.34, clearcoat: 0.45, clearcoatRoughness: 0.35 });
      } else {
        Object.assign(upperMat, { map: knitTex, bumpMap: knitTex, bumpScale: 1.2, roughness: 0.94, sheen: 0.25, sheenRoughness: 0.9, clearcoat: 0 });
        Object.assign(overlayMat, { roughness: 0.6, clearcoat: 0, clearcoatRoughness: 0 });
      }
      upperMat.needsUpdate = true; overlayMat.needsUpdate = true;
    }
    const key = `${s.initials}|${up}`;
    if (key !== lastLabel) {
      lastLabel = key;
      label.visible = !!s.initials;
      if (s.initials) drawLabel(s.initials, luminance(up) > 0.32 ? '#1b1e23' : '#f5f4ef');
    }
  }
  apply(state);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lastLabel = ''; apply(state); });

  /* ---- Add-to-bag hop ---- */
  let hopStart = -1;
  const HOP = 1.25;
  function celebrate() { hopStart = performance.now() / 1000; }
  function poseHop(now) {
    if (hopStart < 0) return;
    const k = (now - hopStart) / HOP;
    if (k >= 1) { hopStart = -1; rig.position.y = 0; rig.rotation.y = 0; rig.scale.set(1, 1, 1); return; }
    const ease = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    rig.position.y = reduceMotion ? 0 : Math.sin(Math.PI * k) * 0.95;
    rig.rotation.y = reduceMotion ? 0 : ease * Math.PI * 2;
    const squash = reduceMotion ? 0 : 0.10 * Math.exp(-Math.pow((k - 0.04) / 0.05, 2)) + 0.12 * Math.exp(-Math.pow((k - 0.97) / 0.045, 2));
    rig.scale.set(1 + squash * 0.6, 1 - squash, 1 + squash * 0.6);
  }

  /* ---- Sizing and render loop ---- */
  const stage = canvas.parentElement;
  let userZoomed = false;
  controls.addEventListener('start', () => { userZoomed = true; });
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    const vHalf = THREE.MathUtils.degToRad(camera.fov / 2), hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
    const fit = Math.max(1.55 / Math.tan(vHalf), 2.55 / Math.tan(hHalf));
    controls.minDistance = fit * 0.6; controls.maxDistance = fit * 1.5;
    if (!userZoomed) camera.position.sub(TARGET).setLength(fit).add(TARGET);
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  let last = performance.now() / 1000;
  renderer.setAnimationLoop(() => {
    const now = performance.now() / 1000, dt = Math.min(0.05, now - last);
    last = now;
    if (spinning) turn.rotation.y += dt * 0.32;
    poseHop(now);
    controls.update();
    renderer.render(scene, camera);
  });

  view3d = { apply, celebrate };
  window.shoeConfigurator = { state, camera, turn, rig, label, totalPrice: () => totalPrice(state), ready: true };
}

/* ============================================================
   Boot
   ============================================================ */
function start(saved) {
  if (saved && typeof saved === 'object') {
    for (const g of GROUPS) if (OPTIONS[g].some((o) => o.id === saved[g])) state[g] = saved[g];
    state.initials = cleanInitials(saved.initials);
  }
  renderOptions();
  syncSpinButton();
  shownPrice = totalPrice(state);
  update();
  init3D();
}
const hot = window.claude?.hot;
try { hot?.snapshot?.(() => ({ ...state })); } catch (err) { /* viewer hook is optional */ }
if (hot?.ready) hot.ready(start); else start(hot?.data ?? {});
</script>
</body>
